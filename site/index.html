<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- covel-theme:start -->
<meta name="color-scheme" content="dark light" />
<style data-covel-theme>
html { color-scheme: light; background: var(--frame, #edf0ea); color: var(--foreground, #27332e); }
html.dark { color-scheme: dark; background: var(--frame, #121915); color: var(--foreground, #e7ece6); }
</style>
<script data-covel-theme>
(() => {
function readPreference(key) {
  try { return globalThis.localStorage?.getItem(key) ?? null; }
  catch { return null; }
}
function readTheme() {
  return readPreference("covel-theme") === "light" ? "light" : "dark";
}
function applyTheme(theme, root = globalThis.document?.documentElement) {
  if (!root) return;
  const dark = theme !== "light";
  root.classList.toggle("dark", dark);
  root.style.colorScheme = dark ? "dark" : "light";
}
applyTheme(readTheme());
})();
</script>
<!-- covel-theme:end -->
    <meta name="description" content="Discover community storytelling worlds for Covel. Add the covel-worlds GitHub topic to join the directory." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Covel Worlds · 世界目录</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Browse Covel worlds on <a href="https://github.com/topics/covel-worlds">GitHub</a>, or download <a href="./catalog.json">the JSON directory</a>. 请开启 JavaScript 使用搜索与筛选。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
